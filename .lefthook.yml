pre-commit:
  parallel: false
  commands:
    cargo-fmt:
      run: cargo fmt --all -- --check
    # cargo check is intentionally omitted: clippy --all-features is a superset
    # (same analysis plus lints, wider feature coverage) and running both forces
    # a full rebuild due to driver/feature-set fingerprint changes.
    cargo-clippy:
      run: cargo clippy --workspace --all-targets --all-features -- -D warnings
    cargo-test:
      run: cargo test --workspace --all-targets --locked --quiet
